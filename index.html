<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para ti ♡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== VARIABLES CSS GLOBALES ===== */
        :root {
            --background: #05050f;
            --background-secondary: #0a0a1a;
            --surface: rgba(255, 255, 255, 0.06);
            --surface-hover: rgba(255, 255, 255, 0.12);
            --text: #f0edff;
            --text-secondary: #a8a3c0;
            --pink: #ec4899;
            --purple: #8b5cf6;
            --border: rgba(139, 92, 246, 0.2);
            --glow: 0 0 30px rgba(236, 72, 153, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --card-radius: 20px;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }

        [data-theme="light"] {
            --background: #f8f6ff;
            --background-secondary: #f0edff;
            --surface: rgba(139, 92, 246, 0.08);
            --surface-hover: rgba(139, 92, 246, 0.15);
            --text: #1a1430;
            --text-secondary: #5a5280;
            --border: rgba(139, 92, 246, 0.25);
            --glow: 0 0 30px rgba(236, 72, 153, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --shadow: 0 8px 32px rgba(139, 92, 246, 0.12);
        }

        /* ===== RESET Y BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: var(--font-sans);
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--background-secondary); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--purple), var(--pink)); border-radius: 4px; }

        h1, h2, h3, h4, h5 { font-family: var(--font-serif); font-weight: 700; }
        h1 { font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1.1; }
        h2 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.2; }
        h3 { font-size: clamp(1.3rem, 2.5vw, 1.8rem); }
        h4 { font-size: clamp(1rem, 1.5vw, 1.2rem); }

        /* ===== NAVBAR ===== */
        #navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition), border-color var(--transition);
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto; padding: 0 1.5rem;
            display: flex; align-items: center; justify-content: space-between; height: 70px;
        }
        .nav-logo {
            font-family: var(--font-serif); font-size: 1.3rem; font-weight: 700;
            text-decoration: none;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-menu {
            display: flex; list-style: none; gap: 0.25rem; align-items: center;
        }
        .nav-menu a {
            color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 500;
            padding: 0.5rem 1rem; border-radius: 999px; transition: all var(--transition);
            position: relative; font-family: var(--font-sans); cursor: pointer;
        }
        .nav-menu a:hover { color: var(--text); background: var(--surface); }
        .nav-menu a.active { color: var(--text); background: var(--surface); }
        .nav-menu a.active::after {
            content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            width: 24px; height: 2px; border-radius: 2px;
            background: linear-gradient(90deg, var(--purple), var(--pink));
        }
        .nav-actions { display: flex; gap: 0.5rem; align-items: center; }
        .nav-icon-btn {
            background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 1.1rem;
            transition: all var(--transition); display: flex; align-items: center; justify-content: center;
        }
        .nav-icon-btn:hover { background: var(--surface-hover); color: var(--text); transform: scale(1.05); box-shadow: var(--glow); }

        .nav-toggle {
            display: none; flex-direction: column; gap: 5px; background: none; border: none;
            cursor: pointer; padding: 5px;
        }
        .nav-toggle span { display: block; width: 25px; height: 2px; background: var(--text); border-radius: 2px; transition: all var(--transition); }
        .nav-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .nav-toggle.active span:nth-child(2) { opacity: 0; }
        .nav-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        /* ===== LOADING ===== */
        .loading-spinner {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: var(--background); z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.3s;
        }
        .loading-spinner.active { opacity: 1; pointer-events: all; }
        .spinner {
            width: 50px; height: 50px; border-radius: 50%;
            border: 3px solid var(--border); border-top-color: var(--pink); border-bottom-color: var(--purple);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== CONTENIDO ===== */
        #app { min-height: 100vh; padding-top: 70px; }
        #content { min-height: calc(100vh - 70px); animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .glass {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow);
        }

        .btn-primary {
            display: inline-block; padding: 0.9rem 2.5rem;
            background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; border: none;
            border-radius: 999px; font-family: var(--font-sans); font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: all var(--transition); text-decoration: none;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 40px rgba(236, 72, 153, 0.35); }

        .section-padding { padding: 4rem 1.5rem; }
        @media (min-width: 768px) { .section-padding { padding: 6rem 2rem; } }
        .section-header { text-align: center; margin-bottom: 3rem; }
        .section-header p { color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .nav-toggle { display: flex; }
            .nav-menu {
                position: fixed; top: 70px; right: -100%; width: 280px; height: calc(100vh - 70px);
                background: var(--glass-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
                flex-direction: column; padding: 2rem 1.5rem; gap: 0.5rem;
                transition: right 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                border-left: 1px solid var(--border); overflow-y: auto; align-items: stretch;
            }
            .nav-menu.active { right: 0; }
            .nav-menu a { padding: 0.8rem 1.2rem; font-size: 1rem; border-radius: 12px; }
            .nav-menu a.active::after { display: none; }
            .nav-menu a.active { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; }
            #app { padding-top: 60px; }
            .nav-menu { top: 60px; height: calc(100vh - 60px); }
            .nav-container { height: 60px; padding: 0 1rem; }
            .nav-logo { font-size: 1.1rem; }
        }

        /* ===== HERO ===== */
        .hero-section {
            position: relative; min-height: calc(100vh - 70px);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: var(--background);
        }
        .hero-bg { position: absolute; inset: 0; z-index: 0; }
        .hero-bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .hero-overlay {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, var(--background) 90%);
            z-index: 1;
        }
        .hero-content {
            position: relative; z-index: 2; text-align: center; max-width: 800px; padding: 2rem;
            animation: heroFadeIn 1.5s ease;
        }
        @keyframes heroFadeIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        .hero-eyebrow {
            font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase;
            color: var(--text-secondary); font-weight: 500; margin-bottom: 1rem;
        }
        .hero-title {
            font-family: var(--font-serif); font-size: clamp(3.5rem, 12vw, 6.5rem); font-weight: 700;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 0.5rem; line-height: 1.1;
        }
        .hero-subtitle {
            font-family: var(--font-serif); font-size: clamp(1.3rem, 3vw, 2rem);
            font-weight: 400; font-style: italic; color: var(--text-secondary); margin-bottom: 1.5rem;
        }
        .hero-text {
            font-size: clamp(1rem, 1.3vw, 1.2rem); color: var(--text-secondary);
            line-height: 1.8; margin-bottom: 2.5rem; max-width: 600px; margin-left: auto; margin-right: auto;
        }
        .scroll-indicator {
            position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
            animation: bounce 2s infinite;
        }
        .scroll-line {
            display: block; width: 2px; height: 40px;
            background: linear-gradient(to bottom, var(--purple), var(--pink));
            border-radius: 2px; animation: scrollLine 2s ease-in-out infinite;
        }
        @keyframes scrollLine { 0%, 100% { transform: scaleY(0.4); opacity: 0.3; } 50% { transform: scaleY(1); opacity: 1; } }
        @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-8px); } }

        /* ===== FOTOS ===== */
        .fotos-filters {
            display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-bottom: 2.5rem;
        }
        .filter-btn {
            padding: 0.5rem 1.5rem; border: 1px solid var(--border); border-radius: 999px;
            background: var(--surface); color: var(--text-secondary);
            font-family: var(--font-sans); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; transition: all var(--transition);
        }
        .filter-btn:hover { background: var(--surface-hover); color: var(--text); }
        .filter-btn.active {
            background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff;
            border-color: transparent; box-shadow: 0 0 30px rgba(139, 92, 246, 0.2);
        }
        .fotos-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem; max-width: 1200px; margin: 0 auto;
        }
        .foto-item {
            position: relative; border-radius: 20px; overflow: hidden; cursor: pointer;
            background: var(--surface); border: 1px solid var(--border);
            transition: all var(--transition); aspect-ratio: 4/3;
        }
        .foto-item:hover { transform: scale(1.03); box-shadow: var(--glow); border-color: var(--purple); }
        .foto-item img, .foto-item video {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform 0.6s ease;
        }
        .foto-item:hover img, .foto-item:hover video { transform: scale(1.08); }
        .foto-item figcaption {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 1.5rem 1.2rem 1.2rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            transform: translateY(100%); transition: transform 0.4s ease;
        }
        .foto-item:hover figcaption { transform: translateY(0); }
        .foto-item figcaption h4 { font-size: 1rem; color: #fff; margin-bottom: 0.2rem; }
        .foto-item figcaption span { font-size: 0.8rem; color: rgba(255,255,255,0.7); }
        .video-item::after {
            content: '▶'; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 3rem;
            color: rgba(255,255,255,0.8); text-shadow: 0 0 30px rgba(0,0,0,0.5);
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .video-item:hover::after { opacity: 1; }
        @media (max-width: 768px) { .fotos-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; } }
        @media (max-width: 480px) {
            .fotos-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
            .foto-item figcaption { padding: 0.8rem 0.8rem 0.6rem; }
            .foto-item figcaption h4 { font-size: 0.8rem; }
        }

        /* ===== CANCIONES ===== */
        .player-container { max-width: 800px; margin: 0 auto; }
        .player-card { padding: 2rem; text-align: center; margin-bottom: 2rem; }
        .player-artwork { width: 200px; height: 200px; border-radius: 20px; overflow: hidden; margin: 0 auto 1.5rem; box-shadow: 0 8px 40px rgba(0,0,0,0.3); }
        .player-artwork img { width: 100%; height: 100%; object-fit: cover; }
        .player-info h3 { font-size: 1.4rem; margin-bottom: 0.2rem; }
        .player-info p { color: var(--text-secondary); font-size: 0.95rem; }
        .player-controls { display: flex; align-items: center; justify-content: center; gap: 1.5rem; margin: 1.5rem 0; }
        .player-btn {
            background: var(--surface); border: 1px solid var(--border); border-radius: 50%;
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            color: var(--text); cursor: pointer; transition: all var(--transition);
        }
        .player-btn:hover { background: var(--surface-hover); transform: scale(1.05); box-shadow: var(--glow); }
        .play-main { width: 60px; height: 60px; background: linear-gradient(135deg, var(--purple), var(--pink)); border: none; color: #fff; box-shadow: 0 4px 30px rgba(139,92,246,0.3); }
        .play-main:hover { transform: scale(1.08); box-shadow: 0 8px 50px rgba(236,72,153,0.4); }
        .player-progress { display: flex; align-items: center; gap: 1rem; margin: 1rem 0; }
        .player-progress span { font-size: 0.8rem; color: var(--text-secondary); min-width: 40px; }
        .progress-bar { flex: 1; height: 4px; background: var(--surface); border-radius: 4px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--purple), var(--pink)); border-radius: 4px; transition: width 0.1s linear; }
        .player-volume { display: flex; align-items: center; gap: 0.75rem; justify-content: center; }
        .volume-slider { width: 80px; height: 4px; -webkit-appearance: none; background: var(--surface); border-radius: 4px; outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, var(--purple), var(--pink)); cursor: pointer; }
        .playlist { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
        .playlist-item {
            display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1.2rem;
            border-radius: 12px; background: var(--surface); border: 1px solid transparent;
            cursor: pointer; transition: all var(--transition);
        }
        .playlist-item:hover { background: var(--surface-hover); border-color: var(--border); }
        .playlist-item.active { border-color: var(--purple); background: var(--surface-hover); box-shadow: var(--glow); }
        .play-btn { font-size: 0.8rem; color: var(--text-secondary); width: 24px; }
        .song-title { flex: 1; font-weight: 500; }
        .song-artist { color: var(--text-secondary); font-size: 0.85rem; }
        .song-duration { color: var(--text-secondary); font-size: 0.8rem; }
        @media (max-width: 600px) {
            .player-card { padding: 1.5rem; }
            .player-artwork { width: 150px; height: 150px; }
            .play-main { width: 50px; height: 50px; }
            .playlist-item { padding: 0.6rem 0.8rem; flex-wrap: wrap; }
        }

        /* ===== CARTA - NUEVO DISEÑO MEJORADO ===== */
        .carta-container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .carta-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 2rem 1.5rem;
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .carta-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.05), rgba(236, 72, 153, 0.05));
            opacity: 0;
            transition: opacity var(--transition);
            border-radius: var(--card-radius);
        }

        .carta-card:hover::before {
            opacity: 1;
        }

        .carta-card:hover {
            transform: translateY(-10px) scale(1.01);
            border-color: var(--purple);
            box-shadow: var(--glow), 0 12px 60px rgba(139, 92, 246, 0.15);
        }

        .carta-card .carta-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: block;
            position: relative;
            z-index: 1;
        }

        .carta-card .carta-titulo {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .carta-card .carta-descripcion {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .carta-card .carta-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.8rem;
            border-radius: 999px;
            letter-spacing: 0.5px;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .carta-card .carta-corazon {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            font-size: 1.2rem;
            opacity: 0.3;
            z-index: 1;
        }

        .carta-card .carta-flores {
            position: absolute;
            top: 1rem;
            left: 1rem;
            font-size: 1.5rem;
            opacity: 0.2;
            z-index: 1;
        }

        /* Modal de carta - versión ampliada y mejorada */
        .carta-modal-content {
            max-width: 750px;
            width: 100%;
            background: var(--background-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .carta-modal-content::before {
            content: '✧';
            position: absolute;
            top: -20px;
            right: -10px;
            font-size: 12rem;
            opacity: 0.03;
            transform: rotate(15deg);
        }

        .carta-modal-content .carta-modal-titulo {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .carta-modal-content .carta-modal-texto {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            line-height: 2.2;
            color: var(--text);
            padding: 1rem 0.5rem;
        }

        .carta-modal-content .carta-modal-texto p {
            margin-bottom: 1.2rem;
            opacity: 0;
            animation: revealText 0.6s ease forwards;
            padding-left: 0.5rem;
            border-left: 2px solid transparent;
            transition: border-color 0.3s ease;
        }

        .carta-modal-content .carta-modal-texto p:hover {
            border-left-color: var(--purple);
        }

        .carta-modal-content .carta-modal-texto p:nth-child(1) { animation-delay: 0.05s; }
        .carta-modal-content .carta-modal-texto p:nth-child(2) { animation-delay: 0.1s; }
        .carta-modal-content .carta-modal-texto p:nth-child(3) { animation-delay: 0.15s; }
        .carta-modal-content .carta-modal-texto p:nth-child(4) { animation-delay: 0.2s; }
        .carta-modal-content .carta-modal-texto p:nth-child(5) { animation-delay: 0.25s; }
        .carta-modal-content .carta-modal-texto p:nth-child(6) { animation-delay: 0.3s; }
        .carta-modal-content .carta-modal-texto p:nth-child(7) { animation-delay: 0.35s; }
        .carta-modal-content .carta-modal-texto p:nth-child(8) { animation-delay: 0.4s; }
        .carta-modal-content .carta-modal-texto p:nth-child(9) { animation-delay: 0.45s; }
        .carta-modal-content .carta-modal-texto p:nth-child(10) { animation-delay: 0.5s; }

        .carta-modal-content .carta-firma {
            font-style: italic;
            text-align: right;
            font-size: 1.3rem;
            margin-top: 2rem;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding-right: 1rem;
            border-right: 3px solid var(--purple);
        }

        .carta-modal-content .carta-fecha {

        // ===== FUNCIÓN DE NAVEGACIÓN =====
        function navigateTo(section) {
            if (isNavigating || section === currentSection) return;
            isNavigating = true;
            loadingSpinner.classList.add('active');

            if (window._playerAudio) {
                window._playerAudio.pause();
            }

            setTimeout(() => {
                const html = sections[section];
                if (html) {
                    content.innerHTML = html;
                    currentSection = section;
                    updateActiveNav(section);
                    history.pushState({ section }, '', '#' + section);

                    initSection(section);

                    if (section === 'inicio') {
                        setTimeout(() => { initStars(); initParticles(); }, 100);
                    } else {
                        if (window._starsInterval) cancelAnimationFrame(window._starsInterval);
                        if (window._particlesInterval) cancelAnimationFrame(window._particlesInterval);
                    }
                } else {
                    content.innerHTML = `<div class="section-padding" style="text-align:center;padding-top:4rem;">
                        <h2>❌ Sección no encontrada</h2>
                        <button class="btn-primary" style="margin-top:2rem;" onclick="navigateTo('inicio')">Volver al inicio</button>
                    </div>`;
                }

                loadingSpinner.classList.remove('active');
                isNavigating = false;
                checkBackToTop();
            }, 300);
        }

        function updateActiveNav(section) {
            navLinks.forEach(link => {
                link.classList.toggle('active', link.dataset.section === section);
            });
        }

        function initSection(section) {
            switch(section) {
                case 'inicio': initInicio(); break;
                case 'fotos': initFotos(); break;
                case 'canciones': initCanciones(); break;
                case 'carta': initCarta(); break;
            }
        }

        window.addEventListener('popstate', (e) => {
            const section = e.state?.section || getSectionFromHash();
            if (section && section !== currentSection) {
                navigateTo(section);
            }
        });

        function getSectionFromHash() {
            const hash = window.location.hash.replace('#', '');
            return Object.keys(sections).includes(hash) ? hash : 'inicio';
        }

        // ===== TEMA OSCURO/CLARO =====
        const themeToggle = document.getElementById('themeToggle');
        const htmlEl = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlEl.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

        themeToggle.addEventListener('click', () => {
            const current = htmlEl.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeToggle.textContent = next === 'dark' ? '🌙' : '☀️';

        // ===== BOTÓN VOLVER ARRIBA =====

        function checkBackToTop() {
            const scrollY = window.scrollY || window.pageYOffset;
            backToTop.classList.toggle('visible', scrollY > 400);

        // ================================================================
        // 2. SISTEMA DE ESTRELLAS
        // ================================================================
        let starsCanvas, starsCtx, stars = [], starsAnimationId = null;

        function initStars() {
            const canvas = document.getElementById('starsCanvas');
            if (!canvas) return;
            if (starsAnimationId) cancelAnimationFrame(starsAnimationId);

            starsCanvas = canvas;
            starsCtx = canvas.getContext('2d');
            resizeStarsCanvas();
            generateStars();
            window.addEventListener('resize', () => { resizeStarsCanvas(); generateStars(); });
            animateStars();
        }

        function resizeStarsCanvas() {
            if (!starsCanvas) return;
            const rect = starsCanvas.parentElement?.getBoundingClientRect() || { width: window.innerWidth, height: window.innerHeight };
            starsCanvas.width = rect.width || window.innerWidth;
            starsCanvas.height = rect.height || window.innerHeight;
        }

        function generateStars() {
            if (!starsCanvas) return;
            const count = Math.min(150, Math.floor((starsCanvas.width * starsCanvas.height) / 12000));
            stars = [];
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * starsCanvas.width,
                    y: Math.random() * starsCanvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    speed: Math.random() * 0.3 + 0.1,
                    opacity: Math.random() * 0.6 + 0.4,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function animateStars() {
            if (!starsCanvas || !starsCtx) return;
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            const time = Date.now() / 1000;
            stars.forEach(star => {
                const twinkle = Math.sin(time * star.speed + star.phase) * 0.3 + 0.7;
                const opacity = star.opacity * twinkle;
                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                starsCtx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                starsCtx.fill();
                if (star.radius > 1.2) {
                    starsCtx.shadowColor = 'rgba(255,255,255,0.1)';
                    starsCtx.shadowBlur = 6;
                    starsCtx.fill();
                    starsCtx.shadowBlur = 0;
                }
            });
            starsAnimationId = requestAnimationFrame(animateStars);
        }

        // ================================================================
        // 3. SISTEMA DE PARTÍCULAS
        // ================================================================
        let particlesCanvas, particlesCtx, particles = [], particlesAnimationId = null;

        function initParticles() {
            const canvas = document.getElementById('particlesCanvas');
            if (!canvas) return;
            if (particlesAnimationId) cancelAnimationFrame(particlesAnimationId);

            particlesCanvas = canvas;
            particlesCtx = canvas.getContext('2d');
            resizeParticlesCanvas();
            generateParticles();
            window.addEventListener('resize', () => { resizeParticlesCanvas(); generateParticles(); });
            animateParticles();
        }

        function resizeParticlesCanvas() {
            if (!particlesCanvas) return;
            const rect = particlesCanvas.parentElement?.getBoundingClientRect() || { width: window.innerWidth, height: window.innerHeight };
            particlesCanvas.width = rect.width || window.innerWidth;
            particlesCanvas.height = rect.height || window.innerHeight;
        }

        function generateParticles() {
            if (!particlesCanvas) return;
            const count = Math.min(40, Math.floor((particlesCanvas.width * particlesCanvas.height) / 40000));
            particles = [];
            for (let i = 0; i < count; i++) {
                const isHeart = Math.random() < 0.15;
                particles.push({
                    x: Math.random() * particlesCanvas.width,
                    y: Math.random() * particlesCanvas.height,
                    size: isHeart ? 12 + Math.random() * 8 : 3 + Math.random() * 4,
                    speedX: (Math.random() - 0.5) * 0.4,
                    speedY: (Math.random() - 0.5) * 0.4 - 0.1,
                    opacity: Math.random() * 0.4 + 0.2,
                    phase: Math.random() * Math.PI * 2,
                    isHeart: isHeart,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.02
                });
            }
        }

        function drawHeart(ctx, x, y, size, rotation, opacity) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            ctx.globalAlpha = opacity;
            const s = size / 16;
            ctx.beginPath();
            ctx.moveTo(0, -s * 4);
            ctx.bezierCurveTo(s * -4, -s * 4, s * -8, 0, 0, s * 8);
            ctx.bezierCurveTo(s * 8, 0, s * 4, -s * 4, 0, -s * 4);
            ctx.closePath();
            const gradient = ctx.createLinearGradient(-s * 4, -s * 4, s * 4, s * 4);
            gradient.addColorStop(0, 'rgba(236, 72, 153, 0.6)');
            gradient.addColorStop(1, 'rgba(139, 92, 246, 0.6)');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.restore();
        }

        function animateParticles() {
            if (!particlesCanvas || !particlesCtx) return;
            particlesCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
            particles.forEach(p => {
                p.x += p.speedX + Math.sin(Date.now() / 10000 + p.phase) * 0.1;
                p.y += p.speedY + Math.cos(Date.now() / 8000 + p.phase) * 0.1;
                p.rotation += p.rotSpeed;
                if (p.x < 0 || p.x > particlesCanvas.width) p.speedX *= -1;
                if (p.y < 0 || p.y > particlesCanvas.height) p.speedY *= -1;
                p.y += Math.sin(Date.now() / 3000 + p.phase) * 0.05;
                const opacity = p.opacity * (0.7 + 0.3 * Math.sin(Date.now() / 2000 + p.phase));
                if (p.isHeart) {
                    drawHeart(particlesCtx, p.x, p.y, p.size, p.rotation, opacity);
                } else {
                    particlesCtx.beginPath();
                    particlesCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    const gradient = particlesCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    gradient.addColorStop(0, `rgba(139, 92, 246, ${opacity * 0.6})`);
                    gradient.addColorStop(1, `rgba(236, 72, 153, ${opacity * 0.2})`);
                    particlesCtx.fillStyle = gradient;
                    particlesCtx.fill();
                }
            });
            particlesAnimationId = requestAnimationFrame(animateParticles);
        }

        // 4. SISTEMA DE MODAL
        // ================================================================
        let modalInstance = null;

        function openModal(content, options = {}) {
            closeModal();
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.setAttribute('role', 'dialog');
            overlay.setAttribute('aria-modal', 'true');

            const modal = document.createElement('div');
            modal.className = 'modal-content' + (options.carta ? ' carta-modal-content' : '');
            modal.style.maxWidth = options.carta ? '750px' : '900px';

            const closeBtn = document.createElement('button');
            closeBtn.className = 'modal-close';
            closeBtn.innerHTML = '✕';
            closeBtn.setAttribute('aria-label', 'Cerrar modal');
            closeBtn.addEventListener('click', closeModal);

            const body = document.createElement('div');
            body.className = 'modal-body';
            body.innerHTML = content;

            modal.appendChild(closeBtn);
            modal.appendChild(body);
            overlay.appendChild(modal);
            document.getElementById('modal-container').appendChild(overlay);
            modalInstance = overlay;

            const escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
            document.addEventListener('keydown', escHandler);
            overlay._escHandler = escHandler;

            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
            document.body.style.overflow = 'hidden';

            if (options.onClose) {
                overlay._onClose = options.onClose;
            }
        }

        function closeModal() {
            if (modalInstance) {
                if (modalInstance._escHandler) {
                    document.removeEventListener('keydown', modalInstance._escHandler);
                }
                if (modalInstance._onClose) {
                    modalInstance._onClose();
                }
                modalInstance.remove();
                modalInstance = null;
                document.body.style.overflow = '';
            }
        }

        function openModalFoto(src, titulo, fecha) {
            const content = `
                <img src="${src}" alt="${titulo}" style="width:100%;max-height:80vh;object-fit:contain;border-radius:12px;">
                <div class="modal-data"><h3>${titulo}</h3><span>${fecha || ''}</span></div>
            `;
            openModal(content);
        }

        function reproducirCancion(index) {
            navigateTo('canciones');
            setTimeout(() => {
                const items = document.querySelectorAll('.playlist-item');
                if (items[index]) {
                    items[index].click();
                }
            }, 500);
        }

        window.openModal = openModal;
        window.closeModal = closeModal;
        window.openModalFoto = openModalFoto;
        window.reproducirCancion = reproducirCancion;

        // ================================================================
        // 5. INICIO - CON MÁS CONTENIDO
        // ================================================================
        function initInicio() {
            console.log('✨ Inicio cargado con más contenido');
            const heroSection = document.querySelector('.hero-section');
            if (heroSection) {
                window.addEventListener('scroll', () => {
                    const scrolled = window.scrollY;
                    const contentEl = heroSection.querySelector('.hero-content');
                    if (contentEl) {
                        contentEl.style.transform = `translateY(${scrolled * 0.05}px)`;
                        contentEl.style.opacity = 1 - (scrolled / 800);
                    }
                }, { passive: true });
            }

            // Contadores animados
            const counters = document.querySelectorAll('.counter-number');
            counters.forEach(counter => {
                const text = counter.textContent;
                if (text !== '∞' && text !== '♡') {
                    const target = parseInt(text);
                    let current = 0;
                    const increment = Math.ceil(target / 30);
                    const interval = setInterval(() => {
                        current += increment;
                        if (current >= target) {
                            current = target;
                            clearInterval(interval);
                        }
                        counter.textContent = current;
                    }, 50);
                }
            });
        }

        // ================================================================
        // 6. FOTOS
        // ================================================================
        function initFotos() {
            console.log('📸 Galería cargada');
            const grid = document.getElementById('fotosGrid');
            if (!grid) return;
            const filters = document.querySelectorAll('.filter-btn');
            const items = grid.querySelectorAll('.foto-item');

            filters.forEach(btn => {
                btn.addEventListener('click', () => {
                    filters.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
                    btn.classList.add('active');
                    btn.setAttribute('aria-selected', 'true');
                    const filter = btn.dataset.filter;
                    items.forEach(item => {
                        const categoria = item.dataset.categoria;
                        const show = filter === 'todos' || categoria === filter;
                        item.style.display = show ? 'block' : 'none';
                    });
                });
            });

            items.forEach(item => {
                item.addEventListener('click', () => {
                    const isVideo = item.classList.contains('video-item');
                    const videoEl = item.querySelector('video');
                    let content = '';
                    if (isVideo && videoEl) {
                        content = `
                            <video src="${videoEl.src}" controls autoplay style="width:100%;max-height:80vh;border-radius:12px;"></video>
                            <div class="modal-data"><h3>${item.dataset.titulo || 'Video'}</h3><span>${item.dataset.fecha || ''}</span></div>
                        `;
                    } else {
                        const img = item.querySelector('img');
                        content = `
                            <img src="${img?.src}" alt="${img?.alt || 'Foto'}" style="width:100%;max-height:80vh;object-fit:contain;border-radius:12px;">
                            <div class="modal-data"><h3>${item.dataset.titulo || 'Foto'}</h3><span>${item.dataset.fecha || ''}</span></div>
                        `;
                    }
                    openModal(content, {
                        onClose: () => {
                            const video = document.querySelector('#modal-container video');
                            if (video) video.pause();
                        }
                    });
                });
            });

            document.querySelectorAll('.video-item video').forEach(video => {
                video.addEventListener('mouseenter', () => { video.play().catch(() => {}); });
                video.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
            });
        }

        // ================================================================
        // 7. CANCIONES
        // ================================================================
        function initCanciones() {
            console.log('🎵 Reproductor cargado');
            const audio = new Audio();
            window._playerAudio = audio;
            let currentIndex = 0;
            let isPlaying = false;
            let isDragging = false;
            const playlistItems = document.querySelectorAll('.playlist-item');
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const progressFill = document.getElementById('progressFill');
            const progressBar = document.getElementById('progressBar');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeBtn = document.getElementById('volumeBtn');
            const favoriteBtn = document.getElementById('favoriteBtn');
            const titleEl = document.getElementById('playerTitle');
            const artistEl = document.getElementById('playerArtist');
            const artworkImg = document.getElementById('artworkImg');

            function loadSong(index) {
                const item = playlistItems[index];
                if (!item) return;
                audio.src = item.dataset.file;
                titleEl.textContent = item.dataset.titulo;
                artistEl.textContent = item.dataset.artista;
                artworkImg.src = item.dataset.portada;
                playlistItems.forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                const favs = JSON.parse(localStorage.getItem('favorites') || '[]');
                favoriteBtn.textContent = favs.includes(item.dataset.file) ? '❤️' : '♡';
                if (isPlaying) audio.play().catch(() => {});
            }

            function togglePlay() {
                if (isPlaying) audio.pause();
                else audio.play().catch(() => {});
            }

            function updatePlayButton() {
                isPlaying = !audio.paused;
                if (isPlaying) {
                    playBtn.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
                } else {
                    playBtn.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
                }
            }

            function prevSong() { currentIndex = (currentIndex - 1 + playlistItems.length) % playlistItems.length; loadSong(currentIndex); }
            function nextSong() { currentIndex = (currentIndex + 1) % playlistItems.length; loadSong(currentIndex); }

            function updateProgress() {
                if (audio.duration && !isDragging) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = percent + '%';
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }
            }

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return mins + ':' + secs.toString().padStart(2, '0');
            }

            audio.addEventListener('loadedmetadata', () => { totalTimeEl.textContent = formatTime(audio.duration); });
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('play', updatePlayButton);
            audio.addEventListener('pause', updatePlayButton);
            audio.addEventListener('ended', nextSong);

            progressBar.addEventListener('mousedown', (e) => { isDragging = true; setProgress(e); });
            document.addEventListener('mousemove', (e) => { if (isDragging) setProgress(e); });
            document.addEventListener('mouseup', () => {
                if (isDragging && audio.duration) {
                    audio.currentTime = (parseFloat(progressFill.style.width) / 100) * audio.duration;
                }
                isDragging = false;
            });

            function setProgress(e) {
                const rect = progressBar.getBoundingClientRect();
                const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                progressFill.style.width = x * 100 + '%';
                if (audio.duration) currentTimeEl.textContent = formatTime(x * audio.duration);
            }

            volumeSlider.addEventListener('input', () => { audio.volume = parseFloat(volumeSlider.value); updateVolumeIcon(); });
            let volumeMuted = false, lastVolume = 0.8;
            volumeBtn.addEventListener('click', () => {
                volumeMuted = !volumeMuted;
                if (volumeMuted) { lastVolume = audio.volume; audio.volume = 0; volumeSlider.value = 0; }
                else { audio.volume = lastVolume; volumeSlider.value = lastVolume; }
                updateVolumeIcon();
            });

            function updateVolumeIcon() {
                const vol = parseFloat(volumeSlider.value);
                volumeBtn.innerHTML = vol === 0 ?
                    `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="4" x2="20" y2="20"/><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>` :
                    `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
            }

            favoriteBtn.addEventListener('click', () => {
                const file = audio.src.split('/').pop();
                let favs = JSON.parse(localStorage.getItem('favorites') || '[]');
                const idx = favs.indexOf(file);
                if (idx === -1) { favs.push(file); favoriteBtn.textContent = '❤️'; }
                else { favs.splice(idx, 1); favoriteBtn.textContent = '♡'; }
                localStorage.setItem('favorites', JSON.stringify(favs));
            });

            playlistItems.forEach((item, index) => {
                item.addEventListener('click', () => { currentIndex = index; loadSong(currentIndex); if (!isPlaying) audio.play().catch(() => {}); });
            });

            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevSong);
            nextBtn.addEventListener('click', nextSong);

            document.addEventListener('keydown', (e) => {
                if (e.target.closest('input')) return;
                if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); togglePlay(); }
                if (e.key === 'ArrowRight') nextSong();
                if (e.key === 'ArrowLeft') prevSong();
            });

            loadSong(0);
            window.player = { audio, play: togglePlay, next: nextSong, prev: prevSong };
        }

        // ================================================================
        // 8. CARTA - MÚLTIPLES CARTAS (8 cartas)
        // ================================================================
        function initCarta() {
            console.log('✉️ Múltiples cartas cargadas (8 cartas)');
            const cards = document.querySelectorAll('.carta-card');

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.dataset.carta;
                    const data = cartasData[id];
                    if (data) {
                        const content = `
                            <h2 class="carta-modal-titulo">${data.titulo}</h2>
                            <div class="carta-modal-texto">
                                ${data.contenido}
                            </div>
                        `;
                        openModal(content, { carta: true });
                    }
                });
            });
        }

        // ================================================================
        // 9. EDITOR DE FONDO - FUNCIONALIDAD COMPLETA
        // ================================================================
        const bgToggle = document.getElementById('bgEditorToggle');
        const bgControls = document.getElementById('bgEditorControls');
        const bgPicker = document.getElementById('bgColorPicker');
        const bgPicker2 = document.getElementById('bgColorPicker2');
        const bgPicker3 = document.getElementById('bgColorPicker3');
        const applyGradientBtn = document.getElementById('applyGradientBtn');
        const resetBgBtn = document.getElementById('resetBgBtn');
        const presetBtns = document.querySelectorAll('.preset-btn');

        let bgVisible = false;

        bgToggle.addEventListener('click', () => {
            bgVisible = !bgVisible;
            bgControls.classList.toggle('hidden', !bgVisible);
            bgToggle.textContent = bgVisible ? '✕' : '🎨';
        });

        // Aplicar color sólido
        bgPicker.addEventListener('input', () => {
            applyBackground(bgPicker.value);
        });

        // Aplicar gradiente
        applyGradientBtn.addEventListener('click', () => {
            const color1 = bgPicker2.value;
            const color2 = bgPicker3.value;
            applyGradient(color1, color2);
        });

        // Presets
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const color = btn.dataset.color;
                bgPicker.value = color;
                applyBackground(color);
                presetBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Restaurar
        resetBgBtn.addEventListener('click', () => {
            const defaultBg = '#05050f';
            bgPicker.value = defaultBg;
            applyBackground(defaultBg);
            presetBtns.forEach(b => b.classList.remove('active'));
            document.querySelector('.preset-btn[data-color="#05050f"]')?.classList.add('active');
        });

        function applyBackground(color) {
            const sections = document.querySelectorAll('#seccion-canciones, #seccion-carta, .hero-section');
            sections.forEach(section => {
                if (section) {
                    section.style.background = color;
                }
            });
            document.querySelector('#app')?.style.setProperty('--background', color);
            localStorage.setItem('customBg', color);
        }

        function applyGradient(color1, color2) {
            const gradient = `linear-gradient(135deg, ${color1}, ${color2})`;
            const sections = document.querySelectorAll('#seccion-canciones, #seccion-carta, .hero-section');
            sections.forEach(section => {
                if (section) {
                    section.style.background = gradient;
                }
            });
            localStorage.setItem('customBgGradient', gradient);
        }

        // Cargar fondo guardado
        function loadSavedBackground() {
            const savedGradient = localStorage.getItem('customBgGradient');
            const savedColor = localStorage.getItem('customBg');
            if (savedGradient) {
                const sections = document.querySelectorAll('#seccion-canciones, #seccion-carta, .hero-section');
                sections.forEach(section => {
                    if (section) {
                        section.style.background = savedGradient;
                    }
                });
            } else if (savedColor) {
                const sections = document.querySelectorAll('#seccion-canciones, #seccion-carta, .hero-section');
                sections.forEach(section => {
                    if (section) {
                        section.style.background = savedColor;
                    }
                });
                bgPicker.value = savedColor;
            }
        }

        // ================================================================
        // 10. INICIO
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            const section = getSectionFromHash();
            navigateTo(section);
            setTimeout(loadSavedBackground, 500);
        });

        // ================================================================
        // 11. EXPONER FUNCIONES GLOBALES
        // ================================================================
        window.navigateTo = navigateTo;
        window.initStars = initStars;
        window.initParticles = initParticles;
        window.initInicio = initInicio;
        window.initFotos = initFotos;
        window.initCanciones = initCanciones;
        window.initCarta = initCarta;
        window.applyBackground = applyBackground;
        window.applyGradient = applyGradient;
        window.openModalFoto = openModalFoto;
        window.reproducirCancion = reproducirCancion;
    </script>
</body>
</html>
